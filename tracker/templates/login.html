<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit_Matrix | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #050505; 
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* DYNAMIC BACKGROUND */
        .orb {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.15;
        }
        .orb-1 { background: #10b981; top: -10%; left: -10%; }
        .orb-2 { background: #3b82f6; bottom: -10%; right: -10%; }

        /* GLASS MORPHISM */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 3rem;
        }

        /* INPUT STYLING */
        .matrix-input {
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transition: all 0.3s ease;
        }
        .matrix-input:focus {
            border-color: #10b981 !important;
            background: rgba(16, 185, 129, 0.05) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>
<body class="p-6">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="max-w-md w-full relative z-10">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-500 rounded-[2rem] shadow-[0_0_40px_rgba(16,185,129,0.3)] mb-6 transform -rotate-6">
                <i data-lucide="key-round" class="text-white w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tighter uppercase">Neural <span class="text-emerald-500">Access</span></h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em] mt-3">Identity Verification Protocol</p>
        </div>

        <div class="glass-card p-10 md:p-12 border border-white/10">
            {% if form.errors %}
            <div class="mb-8 p-4 bg-rose-500/10 border border-rose-500/20 rounded-2xl">
                <p class="text-[11px] text-rose-400 font-black uppercase text-center tracking-tight">Authentication Failed: Invalid Credentials</p>
            </div>
            {% endif %}

            <form method="POST" class="space-y-8">
                {% csrf_token %}

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Username</label>
                    <div class="relative">
                        <input type="text" name="username" required
                            class="w-full px-5 py-4 matrix-input rounded-2xl outline-none text-sm font-medium placeholder-slate-600"
                            placeholder="Enter username">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Secure Password</label>
                    <div class="relative">
                        <input type="password" name="password" required
                            class="w-full px-5 py-4 matrix-input rounded-2xl outline-none text-sm font-medium placeholder-slate-600"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-black py-5 rounded-2xl transition-all duration-300 shadow-[0_15px_30px_rgba(16,185,129,0.2)] uppercase text-xs tracking-[0.2em] flex items-center justify-center gap-3">
                        Unlock Terminal
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-8 border-t border-white/5 text-center">
                <p class="text-slate-500 text-xs font-bold uppercase tracking-tight">
                    New to the network?
                    <a href="{% url 'register' %}" class="text-emerald-500 font-black hover:text-emerald-400 transition-colors ml-1">Register Node</a>
                </p>
            </div>
        </div>

        <p class="text-center text-slate-600 text-[10px] font-bold mt-10 uppercase tracking-[0.4em]">
            FIT_MATRIX AI &bull; SESSION_ID: 2026
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
